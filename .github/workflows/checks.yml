name: Checks

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
    tags:
      - 'v*'
  merge_group:

concurrency:
  # Only cancel in-progress runs for pull_request events, this prevents canceling workflows against main or tags
  # A pull_request will reuse the same group thus enabling cancellation, all others receive a unique run_id
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          packages-token: ${{ github.token }}

      - name: Format
        run: bun turbo run format:check

      - name: Lint
        run: bun turbo run lint

      - name: Types
        run: bun turbo run check-types

      - name: Test
        run: bun turbo run test

  # Temporary benchmark: Checks primes the remote cache before all variants start.
  benchmark-baseline:
    name: Baseline (${{ matrix.cache }})
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    strategy:
      fail-fast: false
      matrix:
        cache: [warm, cold]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          packages-token: ${{ github.token }}
      - name: Format
        run: bun turbo run format:check --cache="${{ matrix.cache == 'cold' && 'local:rw' || 'local:rw,remote:r' }}"
      - name: Lint
        run: bun turbo run lint --cache="${{ matrix.cache == 'cold' && 'local:rw' || 'local:rw,remote:r' }}"
      - name: Types
        run: bun turbo run check-types --cache="${{ matrix.cache == 'cold' && 'local:rw' || 'local:rw,remote:r' }}"
      - name: Test
        run: bun turbo run test --cache="${{ matrix.cache == 'cold' && 'local:rw' || 'local:rw,remote:r' }}"

  benchmark-turbo:
    name: Turbo (${{ matrix.cache }})
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    strategy:
      fail-fast: false
      matrix:
        cache: [warm, cold]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          packages-token: ${{ github.token }}
      - name: Checks
        run: bun turbo run format:check lint check-types test --cache="${{ matrix.cache == 'cold' && 'local:rw' || 'local:rw,remote:r' }}"

  benchmark-matrix:
    name: Matrix (${{ matrix.cache }}, ${{ matrix.task }})
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1
    strategy:
      fail-fast: false
      matrix:
        cache: [warm, cold]
        task: [format:check, lint, check-types, test]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          packages-token: ${{ github.token }}
      - name: Checks
        run: bun turbo run ${{ matrix.task }} --cache="${{ matrix.cache == 'cold' && 'local:rw' || 'local:rw,remote:r' }}"
