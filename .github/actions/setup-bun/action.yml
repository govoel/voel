name: Setup Bun
description: Setup Bun and Install Dependencies

inputs:
  packages-token:
    description: PAT with read:packages for @govoel packages on GitHub Packages.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - name: Authenticate GitHub Packages
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ inputs.packages-token }}
      run: |
        if [ -n "${GH_PACKAGES_TOKEN}" ]; then
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> ~/.npmrc
        else
          echo "::warning::packages-token not set; @govoel packages will fail to install"
        fi
    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
