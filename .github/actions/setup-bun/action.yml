name: Setup Bun
description: Setup Bun and Install Dependencies

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - name: Authenticate GitHub Packages
      shell: bash
      # Composite actions cannot read the secrets context, so callers export
      # GH_PACKAGES_TOKEN (a PAT with read:packages) as job-level env.
      run: |
        if [ -n "${GH_PACKAGES_TOKEN}" ]; then
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> ~/.npmrc
        else
          echo "::warning::GH_PACKAGES_TOKEN not set; @govoel packages will fail to install"
        fi
    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
